-- Hyprland 0.57+ Lua configuration.
-- Press SUPER+CTRL+H for an interactive list of all keybindings.

local terminal = "ghostty"
local fileManager = "ghostty -e yazi"
local menu = "wofi --show drun"

hl.monitor({ output = "", mode = "preferred", position = "auto", scale = "auto" })

hl.on("hyprland.start", function()
    hl.exec_cmd("sh -c 'command -v waybar >/dev/null && waybar'")
end)

hl.config({
    input = {
        kb_layout = "us",
        follow_mouse = 1,
        sensitivity = 0,
        touchpad = { natural_scroll = true, tap_to_click = true },
    },
    general = {
        gaps_in = 5,
        gaps_out = 10,
        border_size = 2,
        col = {
            active_border = { colors = { "rgba(b4befeaa)", "rgba(89b4f4aa)" }, angle = 45 },
            inactive_border = "rgba(585b70aa)",
        },
        layout = "dwindle",
        resize_on_border = true,
    },
    decoration = {
        rounding = 8,
        active_opacity = 1.0,
        inactive_opacity = 0.95,
        shadow = { enabled = true, range = 4, render_power = 3, color = 0xcc1a1b26 },
        blur = { enabled = true, size = 3, passes = 2 },
    },
    animations = { enabled = true },
    dwindle = { preserve_split = true },
    misc = {
        disable_hyprland_logo = true,
        disable_splash_rendering = true,
        mouse_move_enables_dpms = true,
        key_press_enables_dpms = true,
    },
})

hl.window_rule({
    name = "hyprland-keybinds-popup",
    match = { class = "^hyprland-keybinds$" },
    float = true,
    size = "900 720",
    center = true,
    stay_focused = true,
})

local super = "SUPER"
local function bind(key, action)
    hl.bind(super .. " + " .. key, action)
end

-- Applications
bind("RETURN", hl.dsp.exec_cmd(terminal))
bind("D", hl.dsp.exec_cmd(menu))
bind("E", hl.dsp.exec_cmd(fileManager))
bind("Q", hl.dsp.window.close())
hl.bind(super .. " + SHIFT + Q", hl.dsp.exit())
hl.bind(super .. " + CTRL + L", hl.dsp.exec_cmd("hyprlock"))
hl.bind(super .. " + CTRL + H", hl.dsp.exec_cmd("~/.config/hypr/scripts/show-keybinds.sh"))

-- Focus and move windows
for key, direction in pairs({ H = "left", J = "down", K = "up", L = "right" }) do
    bind(key, hl.dsp.focus({ direction = direction }))
    hl.bind(super .. " + SHIFT + " .. key, hl.dsp.window.move({ direction = direction }))
end

-- Workspaces 1 through 9
for i = 1, 9 do
    bind(tostring(i), hl.dsp.focus({ workspace = i }))
    hl.bind(super .. " + SHIFT + " .. tostring(i), hl.dsp.window.move({ workspace = i }))
end
bind("TAB", hl.dsp.focus({ workspace = "previous" }))

-- Layout and window state
bind("F", hl.dsp.window.fullscreen())
bind("P", hl.dsp.window.pseudo())
bind("S", hl.dsp.layout("togglesplit"))
bind("SPACE", hl.dsp.window.float({ action = "toggle" }))
bind("mouse_down", hl.dsp.focus({ workspace = "e+1" }), { mouse = true })
bind("mouse_up", hl.dsp.focus({ workspace = "e-1" }), { mouse = true })

-- Multimedia and screenshots
hl.bind("Print", hl.dsp.exec_cmd("grim -g \"$(slurp)\" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"))
hl.bind("XF86AudioRaiseVolume", hl.dsp.exec_cmd("wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+"), { locked = true, repeating = true })
hl.bind("XF86AudioLowerVolume", hl.dsp.exec_cmd("wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"), { locked = true, repeating = true })
hl.bind("XF86AudioMute", hl.dsp.exec_cmd("wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"), { locked = true })
hl.bind("XF86AudioPlay", hl.dsp.exec_cmd("playerctl play-pause"), { locked = true })
hl.bind("XF86AudioNext", hl.dsp.exec_cmd("playerctl next"), { locked = true })
hl.bind("XF86AudioPrev", hl.dsp.exec_cmd("playerctl previous"), { locked = true })

-- Mouse bindings
hl.bind(super .. " + mouse:272", hl.dsp.window.drag(), { mouse = true })
hl.bind(super .. " + mouse:273", hl.dsp.window.resize(), { mouse = true })

-- Reload after editing this file.
hl.bind(super .. " + SHIFT + R", hl.dsp.exec_cmd("hyprctl reload"))
